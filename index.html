<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танчики</title>
    <link rel="stylesheet" href="css/style.css">
      <script type="module" src="js/index.js"></script>
</head>
<body>

    <header class="header">
        <div class="header__logo">
            <h1>Танчики</h1>
        </div>
        <div class="header__controls">
            <button id="themeToggle" class="btn btn--secondary">Сменить тему</button>
        </div>
    </header>

    <main class="main-container">
        
        <section class="setup-section">
            <h2 class="section-title">Настройки игры</h2>
            <form id="gameSettingsForm" class="settings-form">
                
                <div class="form-group">
                    <label for="mapSelect" class="form-label">Выберите карту:</label>
                    <select id="mapSelect" class="input-field" required>
                        </select>
                </div>

                <div class="form-group">
                    <label for="speedSelect" class="form-label">Скорость танков:</label>
                    <select id="speedSelect" class="input-field">
                        <option value="2">Медленная (Тяжелая броня)</option>
                        <option value="3" selected>Стандартная (Средний бой)</option>
                        <option value="5">Турбо (Легкие танки)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficultySelect" class="form-label">Сложность монстра:</label>
                    <select id="difficultySelect" class="input-field">
                        <option value="10">Легко (10 урона за выстрел)</option>
                        <option value="25" selected>Нормально (25 урона за выстрел)</option>
                        <option value="50">Кошмар (50 урона за выстрел)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn--start">Запустить бой</button>
            </form>
            
            <div class="game-instructions">
                <h3>Управление:</h3>
                <p><b>Пауза:</b> Клавиша <kbd>P</kbd></p>
                <div class="controls-grid">
                    <div class="player-info">
                        <span class="badge badge--green">■</span> 
                        <b>Игрок 1:</b> Стрелочки / <kbd>Enter</kbd> (Огонь)
                    </div>
                    <div class="player-info">
                        <span class="badge badge--blue">■</span> 
                        <b>Игрок 2:</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Space</kbd> (Огонь)
                    </div>
                </div>
            </div>
        </section>

        <section class="game-section">
            <div id="pauseOverlay" class="overlay hidden">ПАУЗА</div>
            
            <canvas id="gameCanvas" width="600" height="440"></canvas>
        </section>

        <section class="leaderboard-section">
            <h2 class="section-title">История сражений</h2>
            
            <div class="leaderboard-controls">
                <button id="clearLogBtn" class="btn btn--danger">Очистить историю</button>
            </div>

            <ul id="battleLog" class="log-list">
                </ul>
        </section>

    </main>

  
</body>
</html>
